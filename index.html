<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex,nofollow">
<title>羊羊得亿 · 喜报生成器</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{padding:16px;background:#f7f7f7}
.wrap{max-width:600px;margin:0 auto}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:16px}
h2{text-align:center;margin-bottom:16px;color:#c8102e}
.tip{white-space:pre-line;background:#fff8e8;padding:12px;border-radius:8px;margin-bottom:16px;font-size:14px;line-height:1.6}
.form-item{margin-bottom:12px}
label{display:block;margin-bottom:4px;font-weight:500}
input,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:16px}
textarea{min-height:100px;resize:vertical}
button{width:100%;padding:12px;background:#c8102e;color:#fff;border:none;border-radius:8px;font-size:17px;font-weight:bold}
#preview{margin-top:20px}
#previewCanvas{width:100%;border-radius:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="tip">🔥🐑【羊羊得亿 · 一起赢金】基金竞赛
🔗 内部链接使用，请勿外传
📝 填写支行、客户经理、产品（最多3个）、总金额、金豆数量
✅ 单个产品示例：
📈中欧多元智选A
50万元🧧
✅ 2–3个产品示例：
📈中欧多元智选A 50万🧧
📈汇添富先锋A 48万🧧
✅ 填好点【生成喜报并记录】
💾 右键图片另存为即可转发
📌 提交自动存档，自己不能查看、修改历史记录
⚠️ 请勿乱填无效数据，有问题联系管理员
🌟金豆攒不停，段位节节升🤩</div>

    <div class="form-item">
      <label>支行</label>
      <input id="branch" placeholder="例如：XX支行">
    </div>
    <div class="form-item">
      <label>客户经理</label>
      <input id="manager" placeholder="姓名">
    </div>
    <div class="form-item">
      <label>产品明细（最多3个）</label>
      <textarea id="productText" placeholder="1个产品：产品名换行金额
多个产品一行一条"></textarea>
    </div>
    <div class="form-item">
      <label>销售总金额</label>
      <input id="total_amount" placeholder="数字">
    </div>
    <div class="form-item">
      <label>金豆数量</label>
      <input id="beans" placeholder="金豆">
    </div>

    <button id="submitBtn">生成喜报并记录</button>
  </div>

  <div id="preview" class="card" style="display:none">
    <canvas id="previewCanvas"></canvas>
  </div>
</div>

<script>
const submitBtn = document.getElementById('submitBtn')
const canvas = document.getElementById('previewCanvas')
const ctx = canvas.getContext('2d')

function parseProduct(text){
  const lines = text.split('\n').map(s=>s.trim()).filter(s=>s)
  const list = []
  for(let line of lines){
    if(list.length>=3) break
    list.push(line)
  }
  return list
}

function drawImage(branch,manager,products,total,beans){
  canvas.width = 900
  canvas.height = 1200
  ctx.fillStyle='#c8102e'
  ctx.fillRect(0,0,900,1200)

  ctx.fillStyle='#fff'
  ctx.font="bold 44px sans-serif"
  ctx.textAlign="center"
  ctx.fillText('🔥🐑【羊羊得亿 · 一起赢金】基金竞赛',450,120)

  ctx.font="bold 36px sans-serif"
  ctx.fillText(`🎉祝贺${branch} ${manager}`,450,220)

  ctx.font="32px sans-serif"
  let y = 300
  const isSingle = products.length===1
  for(let p of products){
    if(isSingle){
      const parts = p.split(/\s+/)
      const name = parts[0]||''
      const num = parts.slice(1).join(' ')||''
      ctx.fillText(`📈${name}`,450,y)
      y += 48
      ctx.fillText(`${num}🧧`,450,y)
      y += 60
    }else{
      ctx.fillText(`📈${p}🧧`,450,y)
      y += 48
    }
  }

  ctx.fillText(`⭐️获得金豆${beans}颗`,450,y+40)
  ctx.fillText(`🌟金豆攒不停，段位节节升🤩`,450,y+100)
}

submitBtn.onclick = async function(){
  const branch = document.getElementById('branch').value.trim()
  const manager = document.getElementById('manager').value.trim()
  const productText = document.getElementById('productText').value.trim()
  const total_amount = document.getElementById('total_amount').value.trim()
  const beans = document.getElementById('beans').value.trim()

  if(!branch||!manager||!productText||!total_amount||!beans){
    alert('请填写全部信息')
    return
  }
  const productList = parseProduct(productText)

  drawImage(branch,manager,productList,Number(total_amount),Number(beans))
  document.getElementById('preview').style.display='block'

  try{
    const res = await fetch("https://xibao.leeduan.workers.dev",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        branch,
        manager,
        total_amount:Number(total_amount),
        beans:Number(beans),
        products:productList
      })
    })
    const ret = await res.json()
    if(ret.error){
      alert("网络异常："+ret.error.message)
    }else{
      alert("生成成功✅")
    }
  }catch(e){
    alert("网络异常："+e.message)
  }
}
</script>
</body>
</html>
